<footer class="app-footer">
  <div class="footer-content">
    <div class="user-section" *ngIf="authService.user() as user; else developerInfo">
      <span class="user-login">{{ user.email }}</span>
      <span class="user-role">{{ user.role }}</span>
    </div>
    <ng-template #developerInfo>
      <div class="footer-section">      
        <p>&copy; {{ 'common.designedBy' | translate }}</p>
        <app-social-icon type="telegram" [url]="configService.developerTelegramUrl"></app-social-icon>
        <app-social-icon type="whatsapp" [url]="configService.developerWhatsAppUrl"></app-social-icon>
        <app-social-icon type="viber" [url]="configService.developerViberUrl"></app-social-icon>
        <app-social-icon type="facebook" [url]="configService.developerFacebookUrl"></app-social-icon>
        <app-social-icon type="linkedin" [url]="configService.developerLinkedInUrl"></app-social-icon>
      </div>
    </ng-template>
  </div>
</footer>
